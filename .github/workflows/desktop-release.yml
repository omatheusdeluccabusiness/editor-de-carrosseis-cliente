name: Desktop release bundles

on:
  workflow_dispatch:

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build and stage the native sidecar
        shell: bash
        run: |
          python scripts/build_sidecar.py --target-dir build/sidecar
          target="$(rustc -vV | awk '/^host:/{print $2}')"
          cp build/sidecar/editor-carrosseis-sidecar "desktop/src-tauri/binaries/editor-carrosseis-sidecar-${target}"
      - name: Install Node dependencies
        run: npm ci
        working-directory: desktop
      - name: Build Tauri bundle
        run: npm run build
        working-directory: desktop
      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: Editor-de-Carrosseis-macOS
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build and stage the native sidecar
        shell: pwsh
        run: |
          python scripts/build_sidecar.py --target-dir build/sidecar
          $target = ((rustc -vV | Select-String '^host:').Line -replace '^host:\s*', '')
          Copy-Item 'build/sidecar/editor-carrosseis-sidecar.exe' "desktop/src-tauri/binaries/editor-carrosseis-sidecar-$target.exe"
      - name: Install Node dependencies
        run: npm ci
        working-directory: desktop
      - name: Build Tauri bundle
        run: npm run build
        working-directory: desktop
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Editor-de-Carrosseis-Windows
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
