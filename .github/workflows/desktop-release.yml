name: Desktop release bundles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-07
        with:
          toolchain: stable
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build and stage the native sidecar
        shell: bash
        run: |
          python scripts/build_sidecar.py --target-dir build/sidecar
          target="$(rustc -vV | awk '/^host:/{print $2}')"
          cp build/sidecar/editor-carrosseis-sidecar "desktop/src-tauri/binaries/editor-carrosseis-sidecar-${target}"
      - name: Install Node dependencies
        run: npm ci
        working-directory: desktop
      - name: Build Tauri bundle
        run: npm run build
        working-directory: desktop
      - name: Verify native installer outputs
        shell: bash
        run: test -n "$(find desktop/src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)"
      - name: Upload macOS installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Editor-de-Carrosseis-macOS
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-07
        with:
          toolchain: stable
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build and stage the native sidecar
        shell: pwsh
        run: |
          python scripts/build_sidecar.py --target-dir build/sidecar
          $target = ((rustc -vV | Select-String '^host:').Line -replace '^host:\s*', '')
          Copy-Item 'build/sidecar/editor-carrosseis-sidecar.exe' "desktop/src-tauri/binaries/editor-carrosseis-sidecar-$target.exe"
      - name: Install Node dependencies
        run: npm ci
        working-directory: desktop
      - name: Build Tauri bundle
        run: npm run build
        working-directory: desktop
      - name: Verify native installer outputs
        shell: pwsh
        run: |
          if (-not (Get-ChildItem 'desktop/src-tauri/target/release/bundle/msi' -Filter '*.msi')) { throw 'MSI installer was not produced.' }
          if (-not (Get-ChildItem 'desktop/src-tauri/target/release/bundle/nsis' -Filter '*.exe')) { throw 'NSIS installer was not produced.' }
      - name: Upload Windows installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Editor-de-Carrosseis-Windows
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
